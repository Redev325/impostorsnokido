name: Extract uploaded ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip unzip]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP into repository
        shell: bash
        run: |
          set -e
          zip_file="735214d72ef444258cfb16bd1116ae3d.zip"
          test -f "$zip_file"
          rm -rf /tmp/unzipped
          mkdir -p /tmp/unzipped
          unzip -q -o "$zip_file" -d /tmp/unzipped
          cp -a /tmp/unzipped/. .
          rm -rf /tmp/unzipped

      - name: Commit extracted files and remove temporary workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/extract-zip.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract uploaded game files [skip unzip]"
          git push
